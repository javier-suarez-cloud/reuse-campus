<nav class="barra">
  <a class="marca" routerLink="/">ReUse Campus</a>

  <div class="enlaces">
    @if (auth.haySesion()) {
      <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
      <a routerLink="/solicitudes/mias" routerLinkActive="activo">Mis solicitudes</a>
      <a routerLink="/solicitudes/recibidas" routerLinkActive="activo">Recibidas</a>
      @if (auth.esAdmin()) {
        <span class="etiqueta">Admin</span>
      }
      <span class="usuario">{{ auth.usuario()?.nombre }}</span>
      <button type="button" (click)="auth.logout()">Cerrar sesión</button>
    } @else {
      <a routerLink="/login" routerLinkActive="activo">Iniciar sesión</a>
      <a routerLink="/registro" routerLinkActive="activo">Registrarse</a>
    }
  </div>
</nav>

<main>
  <router-outlet />
</main>
